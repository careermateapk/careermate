name: careermate
description: CareerMate — AI job search and career copilot (Android + Web).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase (4.x family — stable, versions are compatible with each other)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  google_sign_in: ^7.2.0

  # App structure
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Files, storage, fonts
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0

  # Reading CV text on the phone
  pdfrx: ^2.6.5
  archive: ^4.0.0

  # Opening job links
  url_launcher: ^6.3.1

  # Email with the CV attached from the phone; local CV copy
  flutter_email_sender: ^11.2.0
  path_provider: ^2.1.6

  # Free on-phone notifications with background checks (no server)
  flutter_local_notifications: ^19.4.0
  workmanager: ^0.10.10

  # Reads text that is inside pictures in a CV (free, on the phone)
  google_mlkit_text_recognition: ^0.15.0

  # "Share → CareerMate" from LinkedIn/WhatsApp
  receive_sharing_intent: ^1.9.0

  # CV maker: PDF building, preview and saving
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_file_dialog: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
