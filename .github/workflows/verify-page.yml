name: Publish verify page

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/verify-page.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write Firebase web config
        run: |
          python3 - <<'PY'
          import json
          g = json.load(open('google-services.json'))
          pid = g['project_info']['project_id']
          key = g['client'][0]['api_key'][0]['current_key']
          cfg = {'apiKey': key, 'authDomain': pid + '.firebaseapp.com', 'projectId': pid}
          open('site/config.js', 'w').write('window.FIREBASE_CONFIG = ' + json.dumps(cfg) + ';\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
