name: Build Android app

# Runs on every change pushed to main, and can be started by hand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths-ignore:
      - "collector/**"
      - ".github/workflows/collect-jobs.yml"
      - "firebase/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          flutter --version
          flutter create . --platforms android --org in.careermate --project-name careermate
          rm -f test/widget_test.dart
          # App name shown under the icon
          sed -i 's/android:label="careermate"/android:label="CareerMate"/' android/app/src/main/AndroidManifest.xml
          # Allow opening job links in the browser (Android 11+ package visibility)
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.VIEW' android/app/src/main/AndroidManifest.xml
          # Fixed signing key so Google sign-in keeps working (SHA-1 never changes)
          python3 ci/patch_signing.py

      - name: Connect Firebase
        run: |
          f=$(ls google-services*.json 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then
            cp "$f" android/app/google-services.json
            web_id=$(python3 ci/make_firebase_options.py "$f" in.careermate.careermate)
            echo "GOOGLE_WEB_CLIENT_ID=$web_id" >> "$GITHUB_ENV"
            echo "Firebase connected using $f"
            if [ -z "$web_id" ]; then
              echo "::warning::No Google web client ID found — enable Google sign-in in Firebase, then download google-services.json again."
            fi
          else
            echo "::warning::google-services.json not uploaded yet — the app will show the Firebase setup screen."
          fi

      - name: Get packages
        run: ci/run_and_report.sh flutter pub get

      - name: Check the code
        run: ci/run_and_report.sh flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: ci/run_and_report.sh flutter test

      - name: Build APK
        run: ci/run_and_report.sh flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }} --dart-define=UPLOAD_CV_TO_CLOUD=false

      - name: Check APK signing key
        run: |
          expected="31:B9:00:06:86:F3:CB:BF:EC:9A:AB:60:C8:6F:D2:46:AE:81:22:76"
          apksigner=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          actual=$($apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep "SHA-1" | head -1 | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-z A-Z)
          echo "APK SHA-1: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed with $actual, expected $expected"
            exit 1
          fi

      - name: Publish APK for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CareerMate build ${{ github.run_number }}
          body: |
            Install this APK on your Android phone to test.
            Built from: ${{ github.event.head_commit.message || 'manual run' }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
